[package]
name = "studio-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "writercraft"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
editor-preview = ["dep:craft-editor-egui", "dep:craft-editor-model", "dep:craft-editor-render", "dep:uuid"]

[dependencies]
eframe.workspace = true
egui.workspace = true
studio-core.workspace = true
studio-transfer.workspace = true
rfd.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
image.workspace = true

craft-editor-egui = { workspace = true, optional = true }
craft-editor-model = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

craft-editor-render = { workspace = true, optional = true }
