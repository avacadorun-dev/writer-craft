[package]
name = "studio-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "writercraft"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
editor-preview = ["dep:craft-editor-egui", "dep:craft-editor-model", "dep:craft-editor-render", "dep:uuid", "dep:base64", "dep:sha2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
eframe.workspace = true
egui.workspace = true
studio-core.workspace = true
studio-transfer.workspace = true
rfd.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
time = { version = "=0.3.55", default-features = false, features = ["std"] }
image.workspace = true

craft-editor-egui = { workspace = true, optional = true }
craft-editor-model = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

craft-editor-render = { workspace = true, optional = true }

base64 = { version = "=0.23.1", optional = true }
sha2 = { workspace = true, optional = true }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSSpellChecker"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSRange"], optional = true }
