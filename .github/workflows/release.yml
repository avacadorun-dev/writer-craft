name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing matching prerelease tag; published releases are immutable'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.0
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'

jobs:
  candidate:
    name: Verify accepted exact-source prerelease
    runs-on: macos-15
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CANDIDATE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      fingerprint: ${{ steps.metadata.outputs.fingerprint }}
      tag: ${{ env.CANDIDATE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate existing tag, version and independent named-scope acceptance
        id: metadata
        run: |
          python3 scripts/release-check.py --mode release --tag "$CANDIDATE_TAG" --require-prerelease --github-output
          git show-ref --verify "refs/tags/${CANDIDATE_TAG}"
          test "$(git rev-parse "${CANDIDATE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(python3 scripts/release-check.py --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Prepare pinned Rust checks
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: editor-preview-${{ runner.os }}-${{ runner.arch }}-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            editor-preview-${{ runner.os }}-${{ runner.arch }}-rust-1.97.0-
      - name: Verify default and native-editor source configurations
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git diff --exit-code -- Cargo.lock
          python3 scripts/release-check.py --self-test
          python3 scripts/test-package-installers.py
          python3 scripts/stage-installer-release.py --self-test
          python3 scripts/native-startup-smoke.py --self-test
          python3 scripts/generate-notices.py --self-test
          npx --yes --package @fission-ai/openspec@1.16.1 openspec validate --all --strict --json
      - name: Retain current release decision and versioned notes
        run: |
          mkdir -p artifacts
          python3 scripts/release-check.py --mode release --tag "$CANDIDATE_TAG" --require-prerelease --notes artifacts/release-notes.md --json > artifacts/release-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WriterCraft-${{ steps.metadata.outputs.version }}-release-verification-${{ github.run_id }}
          path: |
            artifacts/release-evidence.json
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 30

  installers:
    name: Build and exercise native installers
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/distribution-alpha2.yml
    with:
      source_ref: ${{ needs.candidate.outputs.commit }}

  draft:
    name: Stage verified installers as an unpublished prerelease
    needs: [candidate, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
      SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
      SOURCE_FINGERPRINT: ${{ needs.candidate.outputs.fingerprint }}
      TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.installers.outputs.artifact }}
          path: installer-artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WriterCraft-${{ needs.candidate.outputs.version }}-release-verification-${{ github.run_id }}
          path: release-verification
      - name: Recheck tag and separate scoped acceptance from immutable installer evidence
        run: |
          test "${{ needs.installers.outputs.commit }}" = "$SOURCE_COMMIT"
          test "${{ needs.installers.outputs.version }}" = "$VERSION"
          test "$(git rev-parse "${TAG}^{commit}")" = "$SOURCE_COMMIT"
          test "$(python3 scripts/release-check.py --fingerprint)" = "$SOURCE_FINGERPRINT"
          python3 scripts/release-check.py --mode release --tag "$TAG" --require-prerelease
          python3 scripts/stage-installer-release.py --self-test
          python3 scripts/stage-installer-release.py --downloads installer-artifacts --output release-assets --commit "$SOURCE_COMMIT" --tag "$TAG" --release-evidence release-verification/release-evidence.json --notes release-verification/release-notes.md
      - name: Create a new unpublished draft without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Refusing to edit or replace any existing draft or publication.' >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* --verify-tag --draft --prerelease --title "WriterCraft ${VERSION}" --notes-file release-assets/release-notes.md
