name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing matching prerelease tag; leave empty for a build-only candidate'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'

jobs:
  candidate:
    name: Verify and build accepted macOS candidate
    runs-on: macos-15
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CANDIDATE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact: WriterCraft-${{ steps.metadata.outputs.version }}-macos-arm64-candidate
      tag: ${{ env.CANDIDATE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate version, changelog and independent acceptance
        id: metadata
        run: |
          python3 scripts/release-check.py --mode release --tag "$CANDIDATE_TAG" --require-prerelease --github-output
          if [[ -n "$CANDIDATE_TAG" ]]; then
            git show-ref --verify "refs/tags/${CANDIDATE_TAG}"
            test "$(git rev-parse "${CANDIDATE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - name: Install native Rust checks
        id: rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin
          echo "compiler=$(rustc -V | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-distribution
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify the release source
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python3 scripts/release-check.py --self-test
          npx --yes --package @fission-ai/openspec@1.16.1 openspec validate --all --strict --json
      - name: Build and package on GitHub
        run: ./scripts/package-macos.sh --release --target aarch64-apple-darwin --output artifacts/WriterCraft.app
      - name: Verify package, notes and acceptance
        run: |
          python3 scripts/release-check.py --mode release --tag "$CANDIDATE_TAG" --require-prerelease --bundle artifacts/WriterCraft.app --notes artifacts/release-notes.md --json > artifacts/release-evidence.json
          codesign --verify --deep --strict artifacts/WriterCraft.app
      - name: Archive candidate and checksums
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent artifacts/WriterCraft.app "artifacts/WriterCraft-${VERSION}-macos-arm64.zip"
          cd artifacts
          shasum -a 256 "WriterCraft-${VERSION}-macos-arm64.zip" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WriterCraft-${{ steps.metadata.outputs.version }}-macos-arm64-candidate
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/release-evidence.json
            artifacts/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft:
    name: Prepare draft prerelease for an existing tag
    needs: candidate
    if: needs.candidate.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: artifacts
      - name: Create or refresh an unpublished draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
        shell: bash
        run: |
          existing=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$existing" == false ]]; then
            echo 'Refusing to overwrite an already published release.' >&2
            exit 1
          elif [[ "$existing" == true ]]; then
            gh release edit "$TAG" --draft --prerelease --title "WriterCraft ${VERSION}" --notes-file artifacts/release-notes.md
            gh release upload "$TAG" artifacts/*.zip artifacts/SHA256SUMS artifacts/release-evidence.json --clobber
          else
            gh release create "$TAG" artifacts/*.zip artifacts/SHA256SUMS artifacts/release-evidence.json --verify-tag --draft --prerelease --title "WriterCraft ${VERSION}" --notes-file artifacts/release-notes.md
          fi
