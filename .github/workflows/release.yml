name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing matching prerelease tag; leave empty for a build-only candidate'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  OPENSPEC_TELEMETRY: '0'
  OPENSPEC_NO_UPDATE_CHECK: '1'

jobs:
  candidate:
    name: Verify and build accepted macOS candidate
    runs-on: macos-15
    timeout-minutes: 70
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CANDIDATE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      artifact: WriterCraft-${{ steps.metadata.outputs.version }}-macos-arm64-candidate
      tag: ${{ env.CANDIDATE_TAG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate version, changelog and independent acceptance
        id: metadata
        run: |
          python3 scripts/release-check.py --mode release --tag "$CANDIDATE_TAG" --require-prerelease --github-output
          if [[ -n "$CANDIDATE_TAG" ]]; then
            git show-ref --verify "refs/tags/${CANDIDATE_TAG}"
            test "$(git rev-parse "${CANDIDATE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install native Rust checks
        id: rust
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin
          echo "compiler=$(rustc -V | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-distribution
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify the release source
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python3 scripts/release-check.py --self-test
          python3 scripts/package-portable.py --self-test
          python3 scripts/stage-release-assets.py --self-test
          python3 scripts/generate-notices.py --self-test
          npx --yes --package @fission-ai/openspec@1.16.1 openspec validate --all --strict --json
      - name: Build and package on GitHub
        run: env GITHUB_SHA="$(git rev-parse HEAD)" ./scripts/package-macos.sh --release --target aarch64-apple-darwin --output artifacts/WriterCraft.app
      - name: Verify package, notes and acceptance
        run: |
          python3 scripts/release-check.py --mode release --tag "$CANDIDATE_TAG" --require-prerelease --bundle artifacts/WriterCraft.app --notes artifacts/release-notes.md --json > artifacts/release-evidence.json
          codesign --verify --deep --strict artifacts/WriterCraft.app
      - name: Archive candidate and checksums
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent artifacts/WriterCraft.app "artifacts/WriterCraft-${VERSION}-macos-arm64.zip"
          cd artifacts
          shasum -a 256 "WriterCraft-${VERSION}-macos-arm64.zip" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WriterCraft-${{ steps.metadata.outputs.version }}-macos-arm64-candidate
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/release-evidence.json
            artifacts/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  portable-candidate:
    name: Engineering candidate (${{ matrix.platform }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libwayland-dev libx11-dev
      - name: Prepare native Rust target
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RUST_TARGET"
          python - <<'PYTHON'
          import hashlib, os, subprocess
          compiler = subprocess.check_output(['rustc', '-V'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('compiler=' + hashlib.sha256(compiler).hexdigest()[:16] + '\n')
          PYTHON
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-distribution
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify the candidate source and packaging
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p artifacts
          python scripts/release-check.py --mode source --json > artifacts/source-evidence.json
          python scripts/package-portable.py --self-test
      - name: Build the native engineering archive on GitHub
        run: env GITHUB_SHA="$SOURCE_COMMIT" python scripts/package-portable.py --target "$RUST_TARGET" --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WriterCraft-${{ needs.candidate.outputs.version }}-${{ matrix.platform }}-candidate
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/build-evidence.json
            artifacts/source-evidence.json
            artifacts/PREVIEW.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft:
    name: Prepare draft prerelease for an existing tag
    needs: [candidate, portable-candidate]
    if: needs.candidate.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: WriterCraft-${{ needs.candidate.outputs.version }}-*-candidate
          path: candidate-artifacts
          merge-multiple: false
      - name: Verify and combine all three platform archives
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          python3 scripts/stage-release-assets.py --self-test
          python3 scripts/stage-release-assets.py --downloads candidate-artifacts --output release-assets --version "$VERSION" --commit "$SOURCE_COMMIT"
      - name: Create or refresh an unpublished draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
        shell: bash
        run: |
          existing=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$existing" == false ]]; then
            echo 'Refusing to overwrite an already published release.' >&2
            exit 1
          elif [[ "$existing" == true ]]; then
            gh release edit "$TAG" --draft --prerelease --title "WriterCraft ${VERSION}" --notes-file release-assets/release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --draft --prerelease --title "WriterCraft ${VERSION}" --notes-file release-assets/release-notes.md
          fi
