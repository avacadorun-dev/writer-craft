</symbol><clipPath id="body-clip"><rect x="264" y="170" width="856" height="742"/></clipPath><linearGradient id="diagram-fill" x2="0" y2="1"><stop stop-color="#273b55"/><stop offset="1" stop-color="#233145"/></linearGradient><clipPath id="note-clip"><rect x="1144" y="140" width="272" height="720"/></clipPath><filter id="paper-shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#32435A" flood-opacity=".07"/></filter></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#EDF1F5" /><rect x="0" y="0" width="1440" height="48" rx="0" fill="#F7F9FC" /><path d="M0 48L1440 48" fill="none" stroke="#D3DCE7" stroke-width="1"/><rect x="20" y="18" width="12" height="12" rx="6" fill="#FF6259" /><rect x="40" y="18" width="12" height="12" rx="6" fill="#FFBD2E" /><rect x="60" y="18" width="12" height="12" rx="6" fill="#28C840" /><use href="#brand" x="100" y="7" width="32" height="32" color="#657386"/><text x="140" y="30" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="16" fill="#26303D" font-weight="600" text-anchor="start" >WriterCraft</text><path d="M264 10L264 38" fill="none" stroke="#D3DCE7" stroke-width="1"/><text x="285" y="30" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#26303D" font-weight="400" text-anchor="start" >Файл</text><use href="#i-save" x="342" y="15" width="18" height="18" color="#657386"/><path d="M378 14L378 34" fill="none" stroke="#D3DCE7" stroke-width="1"/><text x="397" y="30" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#657386" font-weight="400" text-anchor="start" >Остров тишины</text><use href="#i-panel-left" x="1283" y="14" width="20" height="20" color="#657386"/><use href="#i-message-square-text" x="1327" y="14" width="20" height="20" color="#657386"/><use href="#i-settings" x="1388" y="14" width="20" height="20" color="#657386"/><rect x="0" y="912" width="1440" height="28" rx="0" fill="#F7F9FC" /><path d="M0 912L1440 912" fill="none" stroke="#D3DCE7" stroke-width="1"/><use href="#i-check" x="18" y="919" width="14" height="14" color="#417658"/><text x="40" y="931" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="12" fill="#657386" font-weight="400" text-anchor="start" >Все изменения сохранены</text><text x="1420" y="931" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="11" fill="#657386" font-weight="400" text-anchor="end" >ФОКУС · ДИЗАЙН-КОНЦЕПТ</text><rect x="0" y="49" width="1440" height="55" rx="0" fill="#F7F9FC" /><text x="24" y="83" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="18" fill="#26303D" font-weight="600" text-anchor="start" >01. На берегу</text><rect x="1216" y="60" width="156" height="32" rx="6" fill="#E2ECF8" /><text x="1294.0" y="81" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#236AB2" font-weight="400" text-anchor="middle" >Выйти из фокуса</text><use href="#i-download" x="1396" y="66" width="20" height="20" color="#657386"/><path d="M0 104L1440 104" fill="none" stroke="#D3DCE7" stroke-width="1"/><rect x="260.0" y="132" width="920" height="752" rx="10" fill="#FFFFFF" stroke="#D3DCE7" filter="url(#paper-shadow)"/><text x="284.0" y="157" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#26303D" font-weight="400" text-anchor="start" >Обычный текст</text><use href="#i-chevron-right" x="402.0" y="145" width="14" height="14" color="#657386"/><path d="M431.0 142L431.0 162" fill="none" stroke="#D3DCE7" stroke-width="1"/><text x="455.0" y="158" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="15" fill="#657386" font-weight="400" text-anchor="start" >B</text><text x="491.0" y="158" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="15" fill="#657386" font-weight="400" text-anchor="start" font-style="italic">I</text><text x="526.0" y="158" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="15" fill="#657386" font-weight="400" text-anchor="start" text-decoration="underline">U</text><path d="M558.0 142L558.0 162" fill="none" stroke="#D3DCE7" stroke-width="1"/><text x="580.0" y="157" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#657386" font-weight="400" text-anchor="start" >Списки</text><use href="#i-chevron-right" x="636.0" y="145" width="14" height="14" color="#657386"/><path d="M668.0 142L668.0 162" fill="none" stroke="#D3DCE7" stroke-width="1"/><use href="#i-plus" x="687.0" y="142" width="20" height="20" color="#657386"/><text x="715.0" y="157" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#26303D" font-weight="400" text-anchor="start" >Вставка</text><path d="M784.0 142L784.0 162" fill="none" stroke="#D3DCE7" stroke-width="1"/><text x="804.0" y="157" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="14" fill="#657386" font-weight="400" text-anchor="start" >Таблица</text><use href="#i-undo-2" x="1062.0" y="142" width="20" height="20" color="#657386"/><use href="#i-redo-2" x="1102.0" y="142" width="20" height="20" color="#A7B2C1"/><use href="#i-ellipsis" x="1142.0" y="142" width="20" height="20" color="#657386"/><path d="M260.0 172L1180.0 172" fill="none" stroke="#D3DCE7" stroke-width="1"/><text x="340.0" y="229" font-family="'Source Serif 4',Georgia,serif" font-size="29" fill="#26303D" font-weight="600" text-anchor="start" >Там, где начинается история</text><text x="340.0" y="280" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >Мы сошли на пустой причал. Ветер осторожно перебирал</text><text x="340.0" y="312" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >верёвки у лодок, и только маяк продолжал посылать сигнал —</text><text x="340.0" y="344" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >ровный, упрямый, почти человеческий.</text><text x="340.0" y="420" font-family="'Source Serif 4',Georgia,serif" font-size="23" fill="#26303D" font-weight="600" text-anchor="start" >Первый сигнал</text><text x="340.0" y="466" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >Ася остановилась у закрытой калитки. На табличке ещё</text><text x="340.0" y="498" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >можно было разобрать фамилию смотрителя. Девятнадцать</text><text x="340.0" y="530" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >лет назад она знала здесь каждый камень. Теперь ей</text><text x="340.0" y="562" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >предстояло научиться различать тишину и ожидание.</text><rect x="340.0" y="614" width="760" height="86" rx="5" fill="#F0F5FC" /><rect x="340.0" y="614" width="3" height="86" rx="1" fill="#6B98CF" /><text x="360.0" y="641" font-family="'Source Sans 3','SF Pro Text',Arial,sans-serif" font-size="13.5" fill="#236AB2" font-weight="600" text-anchor="start" >Заметка автора</text><text x="360.0" y="674" font-family="'Source Serif 4',Georgia,serif" font-size="18" fill="#26303D" font-weight="400" text-anchor="start" >Пауза перед ответом важнее самого ответа.</text><text x="340.0" y="750" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >Потом дверь открылась. Человек на пороге посмотрел</text><text x="340.0" y="782" font-family="'Source Serif 4',Georgia,serif" font-size="20" fill="#26303D" font-weight="400" text-anchor="start" >на чемодан, на пустой причал и только тогда — на неё.</text><rect x="1172.0" y="190" width="3" height="92" rx="1.5" fill="#C7D0DD" /></svg>