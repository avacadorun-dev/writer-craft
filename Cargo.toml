[workspace]
resolver = "3"
members = ["crates/studio-core", "crates/studio-transfer", "crates/studio-desktop", "crates/studio-cli"]
default-members = ["crates/studio-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
zip = { version = "3", default-features = false, features = ["deflate"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "x11", "wayland"] }
egui = "=0.36.2"
rfd = "=0.17.2"
image = { version = "0.25", default-features = false, features = ["png"] }
studio-core = { path = "crates/studio-core" }
studio-transfer = { path = "crates/studio-transfer" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev]
debug = 0
incremental = false
strip = "none"

[profile.release]
lto = "thin"
strip = "none"
