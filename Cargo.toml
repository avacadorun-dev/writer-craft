[workspace]
resolver = "3"
members = ["crates/studio-core", "crates/studio-transfer", "crates/studio-desktop", "crates/studio-cli"]
default-members = ["crates/studio-desktop"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "blob"] }
tempfile = "3"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "x11", "wayland"] }
egui = "=0.36.2"
rfd = "=0.18.0"
image = { version = "0.25", default-features = false, features = ["png"] }
craft-editor-model = { git = "https://github.com/avacadorun-dev/craft-editor", rev = "baa72a9714411cf3100f47aa075e8c81d5ac49b9" }
craft-editor-egui = { git = "https://github.com/avacadorun-dev/craft-editor", rev = "baa72a9714411cf3100f47aa075e8c81d5ac49b9", features = ["wordcraft-canvas", "native-clipboard"] }
craft-editor-render = { git = "https://github.com/avacadorun-dev/craft-editor", rev = "baa72a9714411cf3100f47aa075e8c81d5ac49b9" }
craft-canvas-model = { git = "https://github.com/avacadorun-dev/craft-canvas", rev = "ca8b74aed8df0ab5db38308a3cf0ef235f3443a1" }
craft-canvas-egui = { git = "https://github.com/avacadorun-dev/craft-canvas", rev = "ca8b74aed8df0ab5db38308a3cf0ef235f3443a1" }
studio-core = { path = "crates/studio-core" }
studio-transfer = { path = "crates/studio-transfer" }

[workspace.metadata.writercraft]
required-ux-scope = "full-editor-parity"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev]
debug = 0
incremental = false
strip = "none"

[profile.release]
lto = "thin"
strip = "none"
