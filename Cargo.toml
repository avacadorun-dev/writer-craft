[workspace]
resolver = "3"
members = ["crates/studio-core", "crates/studio-transfer", "crates/studio-desktop", "crates/studio-cli"]
default-members = ["crates/studio-desktop"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "blob"] }
tempfile = "3"
cap-std = { version = "=4.0.3", default-features = false }
cap-fs-ext = { version = "=4.0.3", default-features = false }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "x11", "wayland"] }
egui = "=0.36.2"
rfd = "=0.18.0"
image = { version = "0.25", default-features = false, features = ["png"] }
craft-editor-model = { git = "https://github.com/avacadorun-dev/craft-editor", rev = "fd96a30cd650b47ef2f889120aaf0da537b201ae" }
craft-editor-egui = { git = "https://github.com/avacadorun-dev/craft-editor", rev = "fd96a30cd650b47ef2f889120aaf0da537b201ae", features = ["wordcraft-canvas", "native-clipboard"] }
craft-editor-render = { git = "https://github.com/avacadorun-dev/craft-editor", rev = "fd96a30cd650b47ef2f889120aaf0da537b201ae" }
craft-canvas-model = { git = "https://github.com/avacadorun-dev/craft-canvas", rev = "b59aefafe64a7e8bbc3d39cda44983223e0fc534" }
craft-canvas-egui = { git = "https://github.com/avacadorun-dev/craft-canvas", rev = "b59aefafe64a7e8bbc3d39cda44983223e0fc534" }
craft-media-preview = { git = "https://github.com/avacadorun-dev/craft-media-preview", rev = "f3705126177b694c4609f4e66799021000618bee", default-features = false, features = ["images", "pdf"] }
craft-media-egui = { git = "https://github.com/avacadorun-dev/craft-media-preview", rev = "f3705126177b694c4609f4e66799021000618bee" }
studio-core = { path = "crates/studio-core" }
studio-transfer = { path = "crates/studio-transfer" }

[workspace.metadata.writercraft]
required-ux-scope = "full-editor-parity"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev]
debug = 0
incremental = false
strip = "none"

[profile.release]
lto = "thin"
strip = "none"

# Craft PDF's patched reader and raster must use the identical reviewed source.
# Cargo ignores dependency-local patches; no upstream UI/window graph is adopted.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "0a9d1f48da9e0e61a2c7b602ba96ef1c4672bcd9" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "0a9d1f48da9e0e61a2c7b602ba96ef1c4672bcd9" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "0a9d1f48da9e0e61a2c7b602ba96ef1c4672bcd9" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "0a9d1f48da9e0e61a2c7b602ba96ef1c4672bcd9" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "0a9d1f48da9e0e61a2c7b602ba96ef1c4672bcd9" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "0a9d1f48da9e0e61a2c7b602ba96ef1c4672bcd9" }
